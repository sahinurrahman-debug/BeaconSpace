# BeaconSpace "mission control" design system: obsidian dark-first base, frosted-glass modules (CSS), ONE accent (nebula rose),
# traffic-light status scale, Inter + JetBrains Mono (loaded in app/dashboard.py). Light and dark both defined; follows the system setting
# (change under  ⋮ ▸ Settings ▸ Theme).
[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
baseFontSize = 16
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
font = "sans-serif"
headingFont = "sans-serif"
showWidgetBorder = true

[theme.light]
primaryColor = "#BE185D"
backgroundColor = "#FAF4F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2A1423"
borderColor = "#E6D3DF"
linkColor = "#BE185D"

[theme.dark]
primaryColor = "#F472B6"
backgroundColor = "#120B14"
secondaryBackgroundColor = "#1E1423"
textColor = "#F6E9F2"
borderColor = "#35223A"
linkColor = "#F9A8D4"
