# BeaconSpace "mission control" design system: obsidian dark-first base, frosted-glass modules (CSS), ONE accent (electric cyan),
# traffic-light status scale, Inter + JetBrains Mono (loaded in app/dashboard.py). Light and dark both defined; follows the system setting
# (change under  ⋮ ▸ Settings ▸ Theme).
[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
baseFontSize = 16
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
font = "sans-serif"
headingFont = "sans-serif"
showWidgetBorder = true

[theme.light]
primaryColor = "#0E7490"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1220"
borderColor = "#D3DAE6"
linkColor = "#0E7490"

[theme.dark]
primaryColor = "#22D3EE"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#111723"
textColor = "#E6EAF2"
borderColor = "#222C3F"
linkColor = "#67E8F9"
