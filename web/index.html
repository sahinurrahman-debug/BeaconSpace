<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeaconSpace</title>
    <meta name="description" content="Satellite flood-damage mapping for rescue teams: where the flood hit, what was damaged, and who is cut off." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" />
    <script>
      // Resolve the theme before first paint (no dark-to-light flash): saved choice, else the system setting.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("bs-theme") || "system"; } catch (e) {}
        var light = pref === "light" || (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
    <script>
      // icons are visible only once their font has loaded (offline or blocked CDN: no stray icon names)
      (function () {
        var ok = function () { document.documentElement.classList.add("icons-ok"); };
        if (document.fonts && document.fonts.load) { document.fonts.load("20px 'Material Symbols Rounded'", "dashboard").then(function (f) { if (f && f.length) ok(); }).catch(function () {}); }
        else ok();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
